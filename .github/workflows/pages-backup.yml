name: GitHub Pages backup

on:
  workflow_run:
    workflows: [Azure Static Web Apps]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild and verify the browser model
        run: |
          pip install --quiet "scikit-learn==1.5.2" "pandas==2.2.3" "numpy==2.1.3"
          python tools/build_static.py
          python tools/check_model_parity.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
